<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Dinkwave Court Booking</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky header + single column (max 980px). Booking = date chips, court-by-hour grid, sticky price bar. Staff = day timeline + action list. */
:root{
  --bg:#F4F7FB; --surface:#FFFFFF; --ink:#0E1C33; --muted:#56667D; --line:#D9E1EC;
  --navy:#0D2C5E; --navy-ink:#0D2C5E; --btn:#0D2C5E; --btn-fg:#FFFFFF; --silver:#A7ADB6;
  --open-bg:#E2F3EE; --open-fg:#0C6B58; --taken-bg:#ECEFF4; --taken-fg:#8592A4;
  --block-bg:#F6EBDD; --block-fg:#8A5A1E; --warn-bg:#FCECEC; --warn-fg:#A12F2F;
  --court:#2C5C93; --court-line:#FFFFFF; --kitchen:#3B6EA8; --strip:#0D2C5E; --strip-fg:#E9EFF8;
  --sky:#DCEBF7; --sun:#F6DFAE; --sea:#2C5C93; --sea-line:#7FA6D3; --sand:#EFE4CC; --apron:#8FA7C4; --net:#0D2C5E; --palm:#0D2C5E; --ball:#E9C44A; --logo-l:block; --logo-d:none;
  --display:"Archivo", "Arial Black", "Helvetica Neue", Arial, sans-serif;
  --body:"Figtree", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08111F; --surface:#0F1B2E; --ink:#E6EDF7; --muted:#97A6BA; --line:#22324B;
  --navy:#C9D8F0; --navy-ink:#AFC7EE; --btn:#5B8AD0; --btn-fg:#06101F; --silver:#6E7888;
  --open-bg:#0F3229; --open-fg:#74D8BC; --taken-bg:#152238; --taken-fg:#5D6F88;
  --block-bg:#33260F; --block-fg:#E7B86E; --warn-bg:#3A1717; --warn-fg:#F2A0A0;
  --court:#1E3F68; --court-line:#C9D8F0; --kitchen:#28507F; --strip:#132A4D; --strip-fg:#D4E0F2;
  --sky:#0C1E3A; --sun:#D8DEE9; --sea:#163A66; --sea-line:#3E6799; --sand:#2A2D33; --apron:#23395A; --net:#040A14; --palm:#040A14; --ball:#E9C44A; --logo-l:none; --logo-d:block;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08111F; --surface:#0F1B2E; --ink:#E6EDF7; --muted:#97A6BA; --line:#22324B;
  --navy:#C9D8F0; --navy-ink:#AFC7EE; --btn:#5B8AD0; --btn-fg:#06101F; --silver:#6E7888;
  --open-bg:#0F3229; --open-fg:#74D8BC; --taken-bg:#152238; --taken-fg:#5D6F88;
  --block-bg:#33260F; --block-fg:#E7B86E; --warn-bg:#3A1717; --warn-fg:#F2A0A0;
  --court:#1E3F68; --court-line:#C9D8F0; --kitchen:#28507F; --strip:#132A4D; --strip-fg:#D4E0F2;
  --sky:#0C1E3A; --sun:#D8DEE9; --sea:#163A66; --sea-line:#3E6799; --sand:#2A2D33; --apron:#23395A; --net:#040A14; --palm:#040A14; --ball:#E9C44A; --logo-l:none; --logo-d:block;
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--strip)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-stretch:118%;line-height:1.1;text-wrap:balance;margin:0;color:var(--navy)}
h1{font-size:clamp(30px,6vw,48px);font-weight:850}
h2{font-size:clamp(22px,3.6vw,28px);font-weight:800}
h3{font-size:17px;font-weight:750}
p{margin:0}
a{color:var(--navy-ink)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--btn);outline-offset:2px}
.eyebrow{font-family:var(--display);font-stretch:112%;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* demo strip + header */
.strip{background:var(--strip);color:var(--strip-fg);font-size:13px}
.strip .wrap{display:flex;gap:8px 14px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-block:7px}
.strip b{font-family:var(--display);font-stretch:112%;letter-spacing:.08em}
.strip button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:999px;padding:3px 12px;font-size:12px;cursor:pointer}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--navy)}
.brand img{height:46px;width:auto;display:var(--logo-l)}
.brand img.dk{display:var(--logo-d)}
nav.main{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav.main a{text-decoration:none;color:var(--muted);font-weight:600;font-size:15px;padding:7px 12px;border-radius:999px}
nav.main a[aria-current="page"]{background:var(--taken-bg);color:var(--navy)}
nav.main a.cta{background:var(--btn);color:var(--btn-fg)}

main{padding-block:28px 120px}
section.view{display:flex;flex-direction:column;gap:28px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:12px 22px;font-weight:700;cursor:pointer;text-decoration:none;background:var(--btn);color:var(--btn-fg)}
.btn.ghost{background:transparent;color:var(--navy-ink);border:1.5px solid var(--line)}
.btn.small{padding:7px 14px;font-size:14px}
.btn.danger{background:var(--warn-bg);color:var(--warn-fg)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,460px);gap:36px;align-items:center}
.avail{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:16px;box-shadow:0 12px 32px rgba(8,20,40,.08);min-width:0}
.avail-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.live{display:inline-flex;align-items:center;gap:6px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--open-fg);box-shadow:0 0 0 3px var(--open-bg)}
.daytog{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px}
.daytog button{border:0;background:transparent;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.daytog button[aria-pressed="true"]{background:var(--btn);color:var(--btn-fg)}
.crow{display:grid;gap:6px}
.crow .lab{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.crow .lab b{font-family:var(--display);font-stretch:112%;color:var(--navy)}
.bar,.ticks{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:3px}
.bar button{height:38px;border-radius:5px;border:0;padding:0;cursor:pointer;background:var(--open-bg);box-shadow:inset 0 0 0 1.5px var(--open-fg);transition:transform .12s}
.bar button:hover{background:var(--btn);box-shadow:none;transform:translateY(-2px)}
.bar button.booked{background:var(--taken-bg);box-shadow:none;cursor:not-allowed;transform:none}
.bar button.past{background:var(--taken-bg);box-shadow:none;opacity:.45;cursor:not-allowed;transform:none}
.bar button.blocked{background:repeating-linear-gradient(135deg,var(--block-bg) 0 5px,transparent 5px 9px);box-shadow:inset 0 0 0 1px var(--block-bg);cursor:not-allowed;transform:none}
.bar button.night:not(.booked):not(.past):not(.blocked){box-shadow:inset 0 0 0 1.5px var(--open-fg),inset 0 -4px 0 var(--ball)}
.ticks span{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.avail-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px;font-size:13px;color:var(--muted)}
.avail-foot .legend i{width:12px;height:12px}
.hero p.lead{font-size:18px;color:var(--muted);max-width:52ch;margin-top:12px}
.hero .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.fact{border-top:3px solid var(--navy);padding-top:10px}
.fact .v{font-family:var(--display);font-stretch:115%;font-size:22px;font-weight:800;color:var(--navy)}
.courts{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.court-card{display:flex;flex-direction:column;gap:10px}
.court-card svg{width:100%;height:auto;display:block;border-radius:6px}
.court-card .row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
table.rates{width:100%;border-collapse:collapse}
table.rates th,table.rates td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
table.rates td:last-child,table.rates th:last-child{text-align:right}
table.rates th{font-size:13px;color:var(--muted);font-weight:600}
.scroll-x{overflow-x:auto}

/* booking */
.steps{display:flex;gap:6px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.steps span{padding:4px 10px;border-radius:999px;background:var(--taken-bg)}
.steps span.on{background:var(--btn);color:var(--btn-fg);font-weight:600}
.dates{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.date-chip{flex:none;display:flex;flex-direction:column;align-items:center;min-width:64px;padding:8px 6px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--surface);cursor:pointer}
.date-chip .d{font-family:var(--display);font-stretch:115%;font-weight:800;font-size:22px;line-height:1.1}
.date-chip .w{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.date-chip .o{font-size:11px;color:var(--open-fg)}
.date-chip[aria-pressed="true"]{border-color:var(--btn);background:var(--btn);color:var(--btn-fg)}
.date-chip[aria-pressed="true"] .w,.date-chip[aria-pressed="true"] .o{color:var(--btn-fg)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px}
table.grid{width:100%;border-collapse:separate;border-spacing:6px}
table.grid th{font-family:var(--display);font-stretch:112%;font-size:14px;color:var(--navy);text-align:center;padding:4px}
table.grid th.t,table.grid td.t{text-align:right;font-size:14px;color:var(--muted);white-space:nowrap;width:1%;padding-right:4px}
.slot{width:100%;min-height:46px;border-radius:8px;border:1.5px solid transparent;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;padding:4px 6px}
.slot.open{background:var(--open-bg);color:var(--open-fg)}
.slot.open:hover{border-color:var(--open-fg)}
.slot.booked,.slot.past{background:var(--taken-bg);color:var(--taken-fg);cursor:not-allowed;font-weight:500}
.slot.past{opacity:.55}
.slot.blocked{background:repeating-linear-gradient(135deg,var(--block-bg) 0 8px,transparent 8px 14px);color:var(--block-fg);cursor:not-allowed;font-weight:500;border-color:var(--block-bg)}
.slot.sel{background:var(--btn);color:var(--btn-fg)}
.slot small{font-weight:500;opacity:.8;font-size:12px}
.hint{font-size:14px;color:var(--warn-fg);min-height:1.5em}
.paybar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(8,20,40,.12);padding-bottom:env(safe-area-inset-bottom,0px)}
.paybar .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;padding-block:12px}
.paybar .what{font-weight:600}
.paybar .price{font-family:var(--display);font-stretch:115%;font-weight:800;font-size:20px;color:var(--navy)}

form.stack{display:grid;gap:16px}
.field{display:grid;gap:6px;min-width:0}
.field label,.field legend{font-weight:600;font-size:15px}
.field .help{font-size:13px;color:var(--muted)}
.field .err{font-size:13px;color:var(--warn-fg)}
input[type=text],input[type=tel],input[type=date],select{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg)}
input:focus,select:focus{border-color:var(--btn);outline:none}
fieldset{border:0;padding:0;margin:0}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg label{display:flex;align-items:center;gap:8px;padding:10px 14px;border:1.5px solid var(--line);border-radius:8px;cursor:pointer;font-weight:500}
.seg label:has(input:checked){border-color:var(--btn);background:var(--taken-bg)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.check input{margin-top:4px;width:18px;height:18px}
.summary dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0}
.summary dt{color:var(--muted)}
.summary dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.summary .total{border-top:1px solid var(--line);padding-top:8px;font-weight:700;font-size:18px}
.book-layout{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;align-items:start}

.confirm{text-align:center;display:grid;gap:14px;justify-items:center}
.code{font-family:var(--display);font-stretch:125%;font-weight:900;font-size:clamp(34px,8vw,52px);letter-spacing:.06em;color:var(--navy);padding:6px 18px;border:2px dashed var(--silver);border-radius:var(--r)}
.ticket{width:100%;max-width:460px;text-align:left}

.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
.pill.confirmed{background:var(--open-bg);color:var(--open-fg)}
.pill.completed{background:var(--taken-bg);color:var(--muted)}
.pill.cancelled,.pill.no_show{background:var(--warn-bg);color:var(--warn-fg)}
.pill.unpaid{background:var(--block-bg);color:var(--block-fg)}
.pill.paid{background:var(--open-bg);color:var(--open-fg)}
.pill.walk{background:var(--taken-bg);color:var(--navy-ink)}

/* info */
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.info-grid ul{margin:10px 0 0;padding-left:20px;display:grid;gap:6px}

/* staff */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px}
.tabs button{border:0;background:transparent;padding:8px 14px;border-radius:999px;font-weight:600;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--btn);color:var(--btn-fg)}
.daybar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.daybar input{width:auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{border-top:3px solid var(--navy);padding-top:8px}
.stat .v{font-family:var(--display);font-stretch:115%;font-weight:800;font-size:26px;color:var(--navy);font-variant-numeric:tabular-nums}
.stat .l{font-size:13px;color:var(--muted)}
table.tl{width:100%;border-collapse:separate;border-spacing:4px;min-width:420px}
table.tl th{font-family:var(--display);font-stretch:112%;font-size:14px;color:var(--navy)}
table.tl td.t{text-align:right;font-size:13px;color:var(--muted);white-space:nowrap;width:1%}
table.tl td.cell{border-radius:6px;padding:6px 8px;font-size:13px;vertical-align:top;height:34px}
td.cell.free{background:transparent;border:1px dashed var(--line)}
td.cell.bk{background:var(--open-bg);color:var(--open-fg);cursor:pointer}
td.cell.bk.walk_in{background:var(--taken-bg);color:var(--navy-ink)}
td.cell.bk.done{background:var(--taken-bg);color:var(--muted)}
td.cell.bl{background:repeating-linear-gradient(135deg,var(--block-bg) 0 8px,transparent 8px 14px);color:var(--block-fg)}
td.cell b{display:block;font-weight:700}
.blist{display:grid;gap:10px}
.bcard{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:start}
.bcard.flash{animation:flash 1.2s ease}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--btn)}100%{box-shadow:0 0 0 0 transparent}}
.bcard .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.bcard .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.bcard .detail{font-size:14px;color:var(--muted);margin-top:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
.empty{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}

@media (max-width:720px){
  .hero{grid-template-columns:1fr}
  .book-layout{grid-template-columns:1fr}
  .bcard{grid-template-columns:1fr}
  .bcard .acts{justify-content:flex-start}
  .brand img{height:36px}
  nav.main{margin-left:0;width:100%}
  nav.main a{padding:6px 10px;font-size:14px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="strip"><div class="wrap">
  <span><b>DEMO</b> &nbsp;All bookings here are sample data. Nothing is sent to the resort.</span>
  <button type="button" id="resetBtn">Reset demo data</button>

<script>
(function(){
"use strict";
// ---------- settings (dummy values, swap later) ----------
var CONFIG = {
  courts:[{id:1,name:"Court 1",note:"Beach side, sea breeze"},{id:2,name:"Court 2",note:"Garden side, shade after 3 PM"}],
  open:6, close:22, maxHours:2, advanceDays:14, cancelHours:12,
  prices:{guest:300, outside:400, night:100, nightFrom:18, paddle:100, balls:50}
};
var KEY="dinkwave-demo-v1";

// ---------- helpers ----------
function pad(n){return (n<10?"0":"")+n}
function dkey(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function addDays(d,n){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x}
function parseKey(k){var p=k.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function fmtDate(k,long){return parseKey(k).toLocaleDateString("en-PH",long?{weekday:"long",month:"long",day:"numeric"}:{weekday:"short",month:"short",day:"numeric"})}
function hl(h){var hh=h%12||12;return hh+":00 "+(h<12||h===24?"AM":"PM")}
function hs(h){var hh=h%12||12;return hh+(h<12||h===24?" AM":" PM")}
function range(hours){var a=Math.min.apply(null,hours),b=Math.max.apply(null,hours)+1;return hl(a)+" – "+hl(b)}
function peso(n){return "₱"+n.toLocaleString("en-PH")}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function todayKey(){return dkey(new Date())}
function hourList(){var a=[];for(var h=CONFIG.open;h<CONFIG.close;h++)a.push(h);return a}
function normPhone(p){p=String(p||"").replace(/[\s\-()]/g,"");if(p.indexOf("+63")===0)p="0"+p.slice(3);return p}
function validPhone(p){return /^09\d{9}$/.test(normPhone(p))}
function courtName(id){return CONFIG.courts.filter(function(c){return c.id===id})[0].name}
function hashStr(s){var h=1779033703^s.length;for(var i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}return h>>>0}
function rng(seed){var a=hashStr(seed);return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
var CODECHARS="ABCDEFGHJKMNPQRSTUVWXYZ23456789";
function makeCode(r){var c;do{c="DW-";for(var i=0;i<4;i++)c+=CODECHARS[Math.floor(r()*CODECHARS.length)]}while(state&&state.bookings.some(function(b){return b.code===c}));return c}
function priceFor(type,hours,paddles,balls){var p=CONFIG.prices,court=0;hours.forEach(function(h){court+=p[type]+(h>=p.nightFrom?p.night:0)});return {court:court,paddles:paddles*p.paddle,balls:balls?p.balls:0,total:court+paddles*p.paddle+(balls?p.balls:0)}}
function slotStart(date,h){var d=parseKey(date);d.setHours(h,0,0,0);return d}

// ---------- seed data ----------
var FIRST=["Marco","Jen","Paolo","Ria","Liam","Hannah","Joy","Carlo","Mika","Daniel","Bea","Ken","Sofia","Noah","Trish","Arvin","Lea","Tom","Yuna","Gabe","Nina","Rafael","Claire","Jomar"];
var LAST=["Villanueva","Alcantara","Reyes","Dela Cruz","Becker","Müller","Tan","Santos","Kim","Fischer","Lim","Navarro","Garcia","Park","Ocampo","Bautista","Wright","Sato","Mendoza","Cruz"];
var state=null;
function seed(){
  var r=rng("dinkwave-seed"),t=new Date(),bookings=[],blocks=[];
  var b3=dkey(addDays(t,3)),b6=dkey(addDays(t,6));
  [6,7].forEach(function(h){blocks.push({id:"bl"+b3+"2"+h,date:b3,court:2,hour:h,reason:"Beginner clinic"})});
  [1,2].forEach(function(c){[17,18].forEach(function(h){blocks.push({id:"bl"+b6+c+h,date:b6,court:c,hour:h,reason:"Resort guest round robin"})})});
  state={v:1,bookings:bookings,blocks:blocks};
  for(var d=-2;d<CONFIG.advanceDays;d++){
    var key=dkey(addDays(t,d)),dr=rng(key);
    CONFIG.courts.forEach(function(c){
      var h=CONFIG.open;
      while(h<CONFIG.close){
        var peak=(h<9||h>=16),p=(peak?0.55:0.2)*(d>6?0.45:1);
        var isBlocked=blocks.some(function(b){return b.date===key&&b.court===c.id&&(b.hour===h||b.hour===h+1)});
        if(!isBlocked&&dr()<p){
          var len=(h+1<CONFIG.close&&dr()<0.45)?2:1,hours=len===2?[h,h+1]:[h];
          var type=dr()<0.55?"guest":"outside",pad_=dr()<0.4?Math.ceil(dr()*4):0,balls=dr()<0.2;
          var end=slotStart(key,h+len),past=end<new Date();
          var walk=dr()<0.18;
          var b={id:"b"+key+c.id+h,code:makeCode(dr),date:key,court:c.id,hours:hours,
            name:FIRST[Math.floor(dr()*FIRST.length)]+" "+LAST[Math.floor(dr()*LAST.length)],
            phone:"09"+String(170000000+Math.floor(dr()*799999999)).slice(0,9),
            type:type,room:type==="guest"?String(101+Math.floor(dr()*24)):"",players:dr()<0.75?4:2,paddles:pad_,balls:balls,
            status:past?"completed":"confirmed",paid:past?true:(dr()<0.12),method:past?(dr()<0.5?"cash":"gcash"):null,
            source:walk?"walk_in":"online",createdAt:Date.now()};
          b.total=priceFor(type,hours,pad_,balls).total;
          if(b.paid&&!b.method)b.method="gcash";
          if(past&&dr()<0.08){b.status="no_show";b.paid=false;b.method=null}
          bookings.push(b);h+=len;
        } else h++;
      }
    });
  }
  return state;
}
function load(){try{var s=localStorage.getItem(KEY);if(s){var o=JSON.parse(s);if(o&&o.v===1)return o}}catch(e){}return null}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
state=load()||seed();save();

function active(b){return b.status!=="cancelled"}
function bookingAt(date,court,h){for(var i=0;i<state.bookings.length;i++){var b=state.bookings[i];if(active(b)&&b.date===date&&b.court===court&&b.hours.indexOf(h)>-1)return b}return null}
function blockAt(date,court,h){for(var i=0;i<state.blocks.length;i++){var b=state.blocks[i];if(b.date===date&&b.court===court&&b.hour===h)return b}return null}
function slotStatus(date,court,h){
  if(blockAt(date,court,h))return "blocked";
  if(bookingAt(date,court,h))return "booked";
  if(slotStart(date,h)<=new Date()&&date<=todayKey()){var n=new Date();if(date<todayKey()||h<=n.getHours())return "past"}
  return "open";
}
function openCount(date){var n=0;CONFIG.courts.forEach(function(c){hourList().forEach(function(h){if(slotStatus(date,c.id,h)==="open")n++})});return n}

// ---------- toast ----------
var toastT;function toast(msg){var t=document.getElementById("toast");t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true},2600)}

// ---------- court drawing (top-down, 20 x 44 ft, 7 ft kitchen) ----------
function courtSVG(id){
  return '<svg viewBox="0 0 480 240" role="img" aria-label="Top-down view of '+esc(courtName(id))+'">'+
  '<rect x="0" y="0" width="480" height="240" fill="var(--court)"/>'+
  '<rect x="20" y="20" width="440" height="200" fill="var(--court)" stroke="var(--court-line)" stroke-width="3"/>'+
  '<rect x="170" y="20" width="140" height="200" fill="var(--kitchen)"/>'+
  '<g stroke="var(--court-line)" stroke-width="3" fill="none"><line x1="170" y1="20" x2="170" y2="220"/><line x1="310" y1="20" x2="310" y2="220"/>'+
  '<line x1="20" y1="120" x2="170" y2="120"/><line x1="310" y1="120" x2="460" y2="120"/></g>'+
  '<line x1="240" y1="12" x2="240" y2="228" stroke="var(--court-line)" stroke-width="5" stroke-dasharray="4 4"/>'+
  '<text x="205" y="124" fill="var(--court-line)" font-size="13" font-family="Figtree,sans-serif" text-anchor="middle" transform="rotate(-90 205 124)">KITCHEN</text>'+
  '<text x="275" y="124" fill="var(--court-line)" font-size="13" font-family="Figtree,sans-serif" text-anchor="middle" transform="rotate(90 275 124)">KITCHEN</text>'+
  '<text x="95" y="76" fill="var(--court-line)" font-size="28" font-weight="800" font-family="Archivo,sans-serif" text-anchor="middle" opacity=".85">'+id+'</text>'+
  '</svg>';
}

// ---------- router ----------
var VIEWS=["home","book","my-booking","info","staff"];
function current(){var h=(location.hash||"").replace("#","");return VIEWS.indexOf(h)>-1?h:"home"}
function route(){
  var v=current();
  VIEWS.forEach(function(n){document.getElementById("v-"+n).hidden=(n!==v)});
  document.querySelectorAll("[data-nav]").forEach(function(a){if(a.getAttribute("data-nav")===v)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  RENDER[v]();
  if(v!=="book")document.getElementById("paybar").hidden=true;
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
document.getElementById("v-home").addEventListener("click",function(e){
  var d=e.target.closest("[data-av]");if(d){avDay=+d.getAttribute("data-av");renderHome();return}
  var f=e.target.closest("[data-full]");if(f){bk.date=f.getAttribute("data-full");bk.court=null;bk.hours=[];bk.step="pick";bk.hint="";return}
  var s=e.target.closest("[data-slot]");if(s){var v=s.getAttribute("data-slot").split("-");bk.date=dkey(addDays(new Date(),avDay));bk.court=+v[0];bk.hours=[+v[1]];bk.step="pick";bk.hint="";location.hash="#book"}
});

// ---------- HOME ----------
var avDay=null;
function availCard(){
  if(avDay===null)avDay=openCount(todayKey())>0?0:1;
  var k=dkey(addDays(new Date(),avDay)),now=new Date(),hrs=hourList();
  var status="";

// ---------- BOOK ----------
var bk={date:null,court:null,hours:[],step:"pick",hint:"",last:null,form:null};
function firstBookableDate(){for(var i=0;i<CONFIG.advanceDays;i++){var k=dkey(addDays(new Date(),i));if(openCount(k)>0)return k}return todayKey()}
function renderBook(){
  if(!bk.date)bk.date=firstBookableDate();
  var el=document.getElementById("v-book");
  var steps='<div class="steps"><span class="'+(bk.step==="pick"?"on":"")+'">1 · Pick a slot</span><span class="'+(bk.step==="form"?"on":"")+'">2 · Your details</span><span class="'+(bk.step==="done"?"on":"")+'">3 · Confirmed</span></div>';
  if(bk.step==="done"){el.innerHTML=steps+confirmHTML();document.getElementById("paybar").hidden=true;return}
  if(bk.step==="form"){el.innerHTML=steps+formHTML();bindForm();document.getElementById("paybar").hidden=true;return}
  var t=new Date(),chips="";
  for(var i=0;i<CONFIG.advanceDays;i++){
    var k=dkey(addDays(t,i)),d=parseKey(k),oc=openCount(k);
    chips+='<button type="button" class="date-chip" data-date="'+k+'" aria-pressed="'+(k===bk.date)+'"><span class="w">'+(i===0?"Today":d.toLocaleDateString("en-PH",{weekday:"short"}))+'</span><span class="d num">'+d.getDate()+'</span><span class="w">'+d.toLocaleDateString("en-PH",{month:"short"})+'</span><span class="o num">'+oc+' open</span></button>';
  }
  var rows=hourList().map(function(h){
    var cells=CONFIG.courts.map(function(c){
      var st=slotStatus(bk.date,c.id,h),sel=bk.court===c.id&&bk.hours.indexOf(h)>-1;
      var label=st==="open"?(sel?"Selected":"Open"+(h>=CONFIG.prices.nightFrom?' <small>· lights</small>':'')):st==="booked"?"Booked":st==="blocked"?esc(blockAt(bk.date,c.id,h).reason):"Past";
      return '<td><button type="button" class="slot '+(sel?"sel":st)+'" data-court="'+c.id+'" data-hour="'+h+'" aria-pressed="'+sel+'"'+(st!=="open"?' aria-disabled="true"':'')+' aria-label="'+esc(c.name)+' '+hl(h)+' '+(sel?"selected":st)+'">'+label+'</button></td>';
    }).join("");
    return '<tr><td class="t num">'+hs(h)+'</td>'+cells+'</tr>';
  }).join("");
  el.innerHTML=steps+
   '<div><h2>Pick a date</h2></div><div class="dates" role="group" aria-label="Dates">'+chips+'</div>'+
   '<div style="display:grid;gap:10px"><div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px"><h2>'+esc(fmtDate(bk.date,true))+'</h2>'+
   '<div class="legend"><span><i style="background:var(--open-bg);border:1px solid var(--open-fg)"></i>Open</span><span><i style="background:var(--btn)"></i>Your pick</span><span><i style="background:var(--taken-bg)"></i>Booked</span><span><i style="background:var(--block-bg)"></i>Reserved by resort</span></div></div>'+
   '<p class="muted">Tap one hour, or two hours in a row on the same court.</p><p class="hint" id="hint" aria-live="polite">'+esc(bk.hint)+'</p>'+
   '<div class="panel" style="padding:8px"><table class="grid"><thead><tr><th class="t"></th>'+CONFIG.courts.map(function(c){return '<th>'+esc(c.name)+'</th>'}).join("")+'</tr></thead><tbody>'+rows+'</tbody></table></div></div>';
  renderPaybar();
}
function renderPaybar(){
  var pb=document.getElementById("paybar");
  if(current()!=="book"||bk.step!=="pick"||!bk.hours.length){pb.hidden=true;return}
  var from=priceFor("guest",bk.hours,0,false).total;
  pb.innerHTML='<div class="wrap"><div><div class="what">'+esc(courtName(bk.court))+' · '+esc(fmtDate(bk.date))+' · '+range(bk.hours)+'</div><div class="muted" style="font-size:14px">'+bk.hours.length+' hour'+(bk.hours.length>1?"s":"")+' · from <span class="price">'+peso(from)+'</span></div></div><button type="button" class="btn" id="toForm">Continue</button></div>';
  pb.hidden=false;
}
document.getElementById("v-book").addEventListener("click",function(e){
  var chip=e.target.closest(".date-chip");
  if(chip){bk.date=chip.getAttribute("data-date");bk.court=null;bk.hours=[];bk.hint="";renderBook();return}
  var s=e.target.closest(".slot");
  if(s){
    var c=+s.getAttribute("data-court"),h=+s.getAttribute("data-hour"),st=slotStatus(bk.date,c,h);
    bk.hint="";
    if(st!=="open"){bk.hint=st==="booked"?"That hour is already booked.":st==="blocked"?"The resort has reserved that hour.":"That time has passed.";renderBook();return}
    if(bk.court!==c||!bk.hours.length){bk.court=c;bk.hours=[h]}
    else if(bk.hours.indexOf(h)>-1){bk.hours=bk.hours.filter(function(x){return x!==h});if(!bk.hours.length)bk.court=null}
    else if(bk.hours.length===1&&Math.abs(bk.hours[0]-h)===1){bk.hours.push(h);bk.hours.sort(function(a,b){return a-b})}
    else{if(bk.hours.length>=CONFIG.maxHours)bk.hint="You can book up to "+CONFIG.maxHours+" hours in a row. We started a new pick.";else bk.hint="Pick hours next to each other. We started a new pick.";bk.hours=[h]}
    renderBook();return;
  }
  var a=e.target.closest("[data-act]");if(!a)return;
  var act=a.getAttribute("data-act");
  if(act==="back"){bk.step="pick";renderBook()}
  if(act==="again"){bk.step="pick";bk.court=null;bk.hours=[];bk.last=null;renderBook();window.scrollTo(0,0)}
});
document.getElementById("paybar").addEventListener("click",function(e){if(e.target.closest("#toForm")){bk.step="form";renderBook();window.scrollTo(0,0)}});

function formHTML(){
  var f=bk.form||{name:"",phone:"",type:"guest",room:"",players:"4",paddles:"0",balls:false};

   '<div class="two"><div class="field"><label for="f-players">Players</label><select id="f-players">'+opts([1,2,3,4],f.players)+'</select></div>'+
   '<div class="field"><label for="f-paddles">Paddles to rent ('+peso(CONFIG.prices.paddle)+' each)</label><select id="f-paddles">'+opts([0,1,2,3,4],f.paddles)+'</select></div></div>'+
   '<label class="check"><input type="checkbox" id="f-balls"'+(f.balls?" checked":"")+'> Rent balls ('+peso(CONFIG.prices.balls)+')</label>'+

  '</form><div class="panel summary" id="sumBox"></div></div>';
}
function readForm(){
  var g=function(id){return document.getElementById(id)};
  var type=document.querySelector('input[name="f-type"]:checked').value;
  return {name:g("f-name").value.trim(),phone:g("f-phone").value.trim(),type:type,room:g("f-room").value.trim(),players:g("f-players").value,paddles:g("f-paddles").value,balls:g("f-balls").checked,agree:g("f-agree").checked};
}
function sumHTML(f){
  var pr=priceFor(f.type,bk.hours,+f.paddles,f.balls),p=CONFIG.prices;
  var lines=bk.hours.map(function(h){return '<dt>'+hl(h)+(h>=p.nightFrom?" (lights)":"")+'</dt><dd>'+peso(p[f.type]+(h>=p.nightFrom?p.night:0))+'</dd>'}).join("");
  return '<p class="eyebrow">Booking summary</p><h3 style="margin:6px 0 4px">'+esc(courtName(bk.court))+'</h3><p class="muted" style="margin-bottom:12px">'+esc(fmtDate(bk.date,true))+'<br>'+range(bk.hours)+'</p>'+
   '<dl>'+lines+(+f.paddles?'<dt>'+f.paddles+' paddle'+(+f.paddles>1?"s":"")+'</dt><dd>'+peso(pr.paddles)+'</dd>':"")+(f.balls?'<dt>Balls</dt><dd>'+peso(pr.balls)+'</dd>':"")+
   '<dt class="total">Total</dt><dd class="total">'+peso(pr.total)+'</dd></dl>'+
   '<p class="muted" style="font-size:14px;margin-top:12px">'+(f.type==="guest"?"Resort guest rate. ":"Outside player rate. ")+'Pay at the front desk, by cash or GCash, when you arrive.</p>';
}
function bindForm(){
  var form=document.getElementById("bkForm");
  var upd=function(){var f=readForm();bk.form=f;document.getElementById("roomWrap").hidden=f.type!=="guest";document.getElementById("sumBox").innerHTML=sumHTML(f)};
  form.addEventListener("input",upd);form.addEventListener("change",upd);upd();
  form.addEventListener("submit",function(e){
    e.preventDefault();var f=readForm(),ok=true;
    var set=function(id,msg){document.getElementById(id).textContent=msg;if(msg)ok=false};
    set("e-name",f.name.length<2?"Enter your full name.":"");
    set("e-phone",!validPhone(f.phone)?"Enter a PH mobile number, like 0917 123 4567.":"");
    set("e-room",f.type==="guest"&&!f.room?"Enter your room number so the front desk can find you.":"");
    set("e-agree",!f.agree?"Tick the box to agree to the rules.":"");
    if(!ok)return;
    var free=bk.hours.every(function(h){return slotStatus(bk.date,bk.court,h)==="open"});
    if(!free){bk.step="pick";bk.hours=[];bk.court=null;bk.hint="Sorry, that slot was just taken. Please pick another.";renderBook();return}
    var b={id:"b"+Date.now(),code:makeCode(Math.random),date:bk.date,court:bk.court,hours:bk.hours.slice(),name:f.name,phone:normPhone(f.phone),type:f.type,room:f.type==="guest"?f.room:"",

    b.total=priceFor(b.type,b.hours,b.paddles,b.balls).total;
    state.bookings.push(b);save();bk.last=b.id;bk.form=null;bk.step="done";renderBook();window.scrollTo(0,0);

  '<div class="panel"><h3>Rain</h3><ul><li>If it rains, the resort may close the courts.</li><li>Rained-out bookings can be moved to another day for free.</li><li>We\'ll text the number you booked with.</li></ul></div>'+
  '<div class="panel"><h3>New to pickleball?</h3><ul><li>Paddles ('+peso(p.paddle)+') and balls ('+peso(p.balls)+') are available to rent.</li><li>Ask the front desk about beginner clinics.</li><li>Remember the kitchen: no volleys inside the 7-foot zone by the net.</li></ul></div>'+
  '<div class="panel"><h3>Find us</h3><p style="margin-top:10px">Aloha Beach Resort<br>Oslob, Cebu, Philippines</p><p style="margin-top:10px"><a href="https://www.google.com/maps/search/?api=1&query=Aloha+Beach+Resort+Oslob+Cebu" target="_blank" rel="noopener">Open in Google Maps</a></p></div>'+
  '<div class="panel"><h3>Contact</h3><p style="margin-top:10px">Front desk: <span class="num">0917 000 0000</span> (sample)<br>Messenger: m.me/dinkwave (sample)<br>Email: hello@dinkwave.ph (sample)</p></div>'+
  '</div>';
}

// ---------- STAFF ----------
var sf={in:false,tab:"day",date:null,cancelAsk:null,flash:null,msg:""};
function renderStaff(){
  var el=document.getElementById("v-staff");
  if(!sf.in){
    el.innerHTML='<div class="panel" style="max-width:420px;margin:0 auto;width:100%"><form class="stack" id="loginForm"><div><p class="eyebrow">Staff only</p><h2>Front desk sign-in</h2></div>'+
     '<div class="field"><label for="s-email">Email</label><input type="text" id="s-email" value="frontdesk@dinkwave.ph" autocomplete="off"></div>'+
     '<div class="field"><label for="s-pass">Password</label><input type="text" id="s-pass" value="demo-password" autocomplete="off"><span class="help">Demo sign-in. Any password works here. The real site will use proper staff accounts.</span></div>'+
     '<button class="btn" type="submit">Sign in</button></form></div>';
    document.getElementById("loginForm").addEventListener("submit",function(e){e.preventDefault();sf.in=true;renderStaff()});
    return;
  }
  if(!sf.date)sf.date=todayKey();
  var tabs='<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h2>Front desk</h2><button class="btn ghost small" type="button" data-act="logout">Sign out</button></div>'+
   '<div class="tabs" role="tablist">'+[["day","Bookings by day"],["block","Block slots"],["walk","Add walk-in"]].map(function(t){return '<button type="button" role="tab" data-tab="'+t[0]+'" aria-selected="'+(sf.tab===t[0])+'">'+t[1]+'</button>'}).join("")+'</div>';
  if(sf.tab==="day")el.innerHTML=tabs+dayHTML();
  if(sf.tab==="block"){el.innerHTML=tabs+blockHTML();bindBlock()}
  if(sf.tab==="walk"){el.innerHTML=tabs+walkHTML();bindWalk()}
  if(sf.flash){var c=document.getElementById("bc-"+sf.flash);if(c){c.classList.add("flash");c.scrollIntoView({block:"center",behavior:"smooth"})}sf.flash=null}
}
function dayHTML(){
  var d=sf.date,list=state.bookings.filter(function(b){return b.date===d}).sort(function(a,b){return a.hours[0]-b.hours[0]||a.court-b.court});
  var act=list.filter(active),hrs=0,unpaid=0;act.forEach(function(b){if(b.status!=="no_show")hrs+=b.hours.length;if(!b.paid&&b.status==="confirmed")unpaid+=b.total});
  var blocked=state.blocks.filter(function(b){return b.date===d}).length,total=CONFIG.courts.length*hourList().length;
  var rows="",skip={};
  hourList().forEach(function(h){
    rows+='<tr><td class="t num">'+hs(h)+'</td>';
    CONFIG.courts.forEach(function(c){
      if(skip[c.id+"-"+h])return;
      var bl=blockAt(d,c.id,h);if(bl){rows+='<td class="cell bl">'+esc(bl.reason)+'</td>';return}
      var b=bookingAt(d,c.id,h);
      if(b&&b.hours[0]===h){if(b.hours.length>1)skip[c.id+"-"+(h+1)]=1;
        rows+='<td class="cell bk '+b.source+(b.status!=="confirmed"?" done":"")+'" rowspan="'+b.hours.length+'" data-goto="'+b.id+'"><b>'+esc(b.name)+'</b>'+(b.paid?"Paid":"Unpaid")+(b.source==="walk_in"?" · walk-in":"")+(b.status==="no_show"?" · no-show":"")+'</td>';return}
      if(b){return}
      rows+='<td class="cell free"></td>';
    });
    rows+='</tr>';
  });
  var cards=list.length?list.map(bookingCard).join(""):'<div class="empty">No bookings on this day yet.</div>';
  return '<div class="daybar"><button class="btn ghost small" type="button" data-act="prev" aria-label="Previous day">← Prev</button><input type="date" id="s-date" value="'+d+'"><button class="btn ghost small" type="button" data-act="next" aria-label="Next day">Next →</button><button class="btn ghost small" type="button" data-act="today">Today</button><span class="muted">'+esc(fmtDate(d,true))+'</span></div>'+
   '<div class="stats"><div class="stat"><div class="v">'+act.length+'</div><div class="l">Bookings</div></div><div class="stat"><div class="v">'+hrs+' / '+total+'</div><div class="l">Court hours booked</div></div><div class="stat"><div class="v">'+peso(unpaid)+'</div><div class="l">Still to collect</div></div><div class="stat"><div class="v">'+blocked+'</div><div class="l">Hours blocked</div></div></div>'+
   '<div class="panel scroll-x" style="padding:8px"><table class="tl"><thead><tr><th></th>'+CONFIG.courts.map(function(c){return '<th>'+esc(c.name)+'</th>'}).join("")+'</tr></thead><tbody>'+rows+'</tbody></table></div>'+
   '<div><h3 style="margin-bottom:10px">All bookings</h3><div class="blist">'+cards+'</div></div>';
}
function bookingCard(b){
  var acts="";
  if(b.status==="confirmed"){
    if(!b.paid)acts+='<button class="btn small" type="button" data-act="paid" data-m="cash" data-id="'+b.id+'">Paid cash</button><button class="btn small" type="button" data-act="paid" data-m="gcash" data-id="'+b.id+'">Paid GCash</button>';
    else acts+='<button class="btn ghost small" type="button" data-act="unpaid" data-id="'+b.id+'">Undo paid</button>';
    if(sf.cancelAsk===b.id)acts+='<button class="btn danger small" type="button" data-act="cancel2" data-id="'+b.id+'">Confirm cancel</button><button class="btn ghost small" type="button" data-act="cancelNo">Keep</button>';
    else acts+='<button class="btn ghost small" type="button" data-act="noshow" data-id="'+b.id+'">No-show</button><button class="btn ghost small" type="button" data-act="cancel1" data-id="'+b.id+'">Cancel</button>';
  } else if(b.status!=="completed") acts+='<button class="btn ghost small" type="button" data-act="restore" data-id="'+b.id+'">Restore</button>';
  return '<div class="panel bcard" id="bc-'+b.id+'"><div><div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap"><strong class="num">'+range(b.hours)+'</strong><span>'+esc(courtName(b.court))+'</span><span class="muted num">'+esc(b.code)+'</span></div>'+
   '<div style="font-weight:600;margin-top:4px">'+esc(b.name)+' <span class="muted num" style="font-weight:400">· '+esc(b.phone)+'</span></div>'+
   '<div class="detail">'+(b.type==="guest"?"Resort guest, room "+esc(b.room):"Outside player")+' · '+b.players+' players'+(b.paddles?' · '+b.paddles+' paddles':'')+(b.balls?' · balls':'')+' · <span class="num">'+peso(b.total)+'</span></div>'+
   '<div class="meta">'+statusPill(b)+(b.status==="confirmed"||b.status==="completed"?'<span class="pill '+(b.paid?"paid":"unpaid")+'">'+(b.paid?"Paid · "+(b.method==="gcash"?"GCash":"Cash"):"Unpaid")+'</span>':'')+(b.source==="walk_in"?'<span class="pill walk">Walk-in</span>':'')+'</div></div>'+
   '<div class="acts">'+acts+'</div></div>';
}
function hourOpts(from,to,sel){var s="";for(var h=from;h<=to;h++)s+='<option value="'+h+'"'+(h===sel?" selected":"")+'>'+hl(h)+'</option>';return s}
function courtOpts(both){return (both?'<option value="0">Both courts</option>':'')+CONFIG.courts.map(function(c){return '<option value="'+c.id+'">'+esc(c.name)+'</option>'}).join("")}
function blockHTML(){
  var tk=todayKey(),up=state.blocks.filter(function(b){return b.date>=tk}).sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:a.hour-b.hour||a.court-b.court});
  var groups={};up.forEach(function(b){var k=b.date+"|"+b.court+"|"+b.reason;(groups[k]=groups[k]||[]).push(b)});
  var list=Object.keys(groups).map(function(k){var g=groups[k],b=g[0];return '<div class="panel bcard"><div><strong>'+esc(fmtDate(b.date))+'</strong> · '+esc(courtName(b.court))+'<div class="detail num">'+range(g.map(function(x){return x.hour}))+' · '+esc(b.reason)+'</div></div><div class="acts"><button class="btn ghost small" type="button" data-act="unblock" data-ids="'+g.map(function(x){return x.id}).join(",")+'">Remove</button></div></div>'}).join("")||'<div class="empty">No upcoming blocks.</div>';
  return '<form class="panel stack" id="blForm" novalidate><h3>Block courts for maintenance, events or weather</h3>'+
   '<div class="two"><div class="field"><label for="bl-court">Court</label><select id="bl-court">'+courtOpts(true)+'</select></div><div class="field"><label for="bl-date">Date</label><input type="date" id="bl-date" value="'+tk+'"></div></div>'+
   '<div class="two"><div class="field"><label for="bl-from">From</label><select id="bl-from">'+hourOpts(CONFIG.open,CONFIG.close-1,CONFIG.open)+'</select></div><div class="field"><label for="bl-to">Until</label><select id="bl-to">'+hourOpts(CONFIG.open+1,CONFIG.close,CONFIG.open+2)+'</select></div></div>'+
   '<div class="field"><label for="bl-reason">Reason (shown to players)</label><select id="bl-reason"><option>Maintenance</option><option>Rain – courts closed</option><option>Tournament</option><option>Beginner clinic</option><option>Private event</option></select></div>'+
   '<p class="err" id="bl-err" style="color:var(--warn-fg);font-size:14px"></p><div><button class="btn" type="submit">Block these hours</button></div></form>'+
   '<div><h3 style="margin-bottom:10px">Upcoming blocks</h3><div class="blist">'+list+'</div></div>';
}
function bindBlock(){
  document.getElementById("blForm").addEventListener("submit",function(e){
    e.preventDefault();var g=function(id){return document.getElementById(id).value};
    var c=+g("bl-court"),d=g("bl-date"),from=+g("bl-from"),to=+g("bl-to"),reason=g("bl-reason"),err=document.getElementById("bl-err");
    if(!d){err.textContent="Pick a date.";return}
    if(to<=from){err.textContent="'Until' must be later than 'From'.";return}
    var courts=c?[c]:CONFIG.courts.map(function(x){return x.id}),clash=[],n=0;
    courts.forEach(function(ci){for(var h=from;h<to;h++){if(bookingAt(d,ci,h))clash.push(courtName(ci)+" at "+hs(h))}});
    if(clash.length){err.textContent="These hours already have bookings: "+clash.join(", ")+". Cancel those bookings first, or pick other hours.";return}
    courts.forEach(function(ci){for(var h=from;h<to;h++){if(!blockAt(d,ci,h)){state.blocks.push({id:"bl"+Date.now()+ci+h,date:d,court:ci,hour:h,reason:reason});n++}}});
    save();renderStaff();toast(n+" hour"+(n===1?"":"s")+" blocked");
  });
}
function walkHTML(){
  var n=new Date(),h0=Math.min(Math.max(n.getHours()+1,CONFIG.open),CONFIG.close-1);
  return '<form class="panel stack" id="wkForm" novalidate><h3>Add a walk-in booking</h3>'+
   '<div class="two"><div class="field"><label for="w-court">Court</label><select id="w-court">'+courtOpts(false)+'</select></div><div class="field"><label for="w-date">Date</label><input type="date" id="w-date" value="'+todayKey()+'"></div></div>'+
   '<div class="two"><div class="field"><label for="w-start">Start</label><select id="w-start">'+hourOpts(CONFIG.open,CONFIG.close-1,h0)+'</select></div><div class="field"><label for="w-len">Length</label><select id="w-len"><option value="1">1 hour</option><option value="2">2 hours</option></select></div></div>'+
   '<div class="two"><div class="field"><label for="w-name">Name</label><input type="text" id="w-name"></div><div class="field"><label for="w-phone">Mobile (optional)</label><input type="tel" id="w-phone"></div></div>'+
   '<div class="two"><div class="field"><label for="w-type">Player type</label><select id="w-type"><option value="guest">Resort guest</option><option value="outside">Outside player</option></select></div><div class="field"><label for="w-room">Room (guests)</label><input type="text" id="w-room"></div></div>'+
   '<div class="two"><div class="field"><label for="w-paid">Payment</label><select id="w-paid"><option value="">Not paid yet</option><option value="cash">Paid cash</option><option value="gcash">Paid GCash</option></select></div><div class="field"><label>Total</label><div id="w-total" class="price" style="font-family:var(--display);font-stretch:115%;font-weight:800;font-size:22px;color:var(--navy);padding-top:6px"></div></div></div>'+
   '<p class="err" id="w-err" style="color:var(--warn-fg);font-size:14px"></p><div><button class="btn" type="submit">Add walk-in</button></div></form>';
}
function bindWalk(){
  var f=document.getElementById("wkForm"),g=function(id){return document.getElementById(id).value};
  var hrs=function(){var s=+g("w-start"),l=+g("w-len");return l===2?[s,s+1]:[s]};
  var upd=function(){document.getElementById("w-total").textContent=peso(priceFor(g("w-type"),hrs(),0,false).total)};
  f.addEventListener("change",upd);upd();
  f.addEventListener("submit",function(e){
    e.preventDefault();var err=document.getElementById("w-err"),d=g("w-date"),c=+g("w-court"),hours=hrs(),name=g("w-name").trim();
    if(!name){err.textContent="Enter the player's name.";return}
    if(hours[hours.length-1]>=CONFIG.close){err.textContent="That runs past closing time. Pick an earlier start or 1 hour.";return}
    if(g("w-phone")&&!validPhone(g("w-phone"))){err.textContent="That mobile number doesn't look right. Use 09XX XXX XXXX, or leave it blank.";return}
    var bad=hours.filter(function(h){var s=slotStatus(d,c,h);return s==="booked"||s==="blocked"});
    if(bad.length){err.textContent=courtName(c)+" is taken at "+bad.map(hs).join(", ")+". Pick another time or court.";return}
    var m=g("w-paid"),b={id:"b"+Date.now(),code:makeCode(Math.random),date:d,court:c,hours:hours,name:name,phone:normPhone(g("w-phone")),type:g("w-type"),room:g("w-room").trim(),players:4,paddles:0,balls:false,status:"confirmed",paid:!!m,method:m||null,source:"walk_in",createdAt:Date.now()};
    b.total=priceFor(b.type,hours,0,false).total;state.bookings.push(b);save();
    sf.tab="day";sf.date=d;sf.flash=b.id;renderStaff();toast("Walk-in added for "+name);
  });
}
document.getElementById("v-staff").addEventListener("click",function(e){
  var t=e.target.closest("[data-tab]");if(t){sf.tab=t.getAttribute("data-tab");sf.cancelAsk=null;renderStaff();return}
  var go=e.target.closest("[data-goto]");if(go){sf.flash=go.getAttribute("data-goto");renderStaff();return}
  var a=e.target.closest("[data-act]");if(!a)return;
  var act=a.getAttribute("data-act"),id=a.getAttribute("data-id"),b=id?state.bookings.filter(function(x){return x.id===id})[0]:null;
  switch(act){
    case "logout":sf.in=false;break;
    case "prev":sf.date=dkey(addDays(parseKey(sf.date),-1));break;
    case "next":sf.date=dkey(addDays(parseKey(sf.date),1));break;
    case "today":sf.date=todayKey();break;
    case "paid":b.paid=true;b.method=a.getAttribute("data-m");toast(b.name+" marked paid");break;
    case "unpaid":b.paid=false;b.method=null;break;
    case "noshow":b.status="no_show";toast(b.name+" marked no-show");break;
    case "cancel1":sf.cancelAsk=id;break;
    case "cancelNo":sf.cancelAsk=null;break;
    case "cancel2":b.status="cancelled";sf.cancelAsk=null;toast("Booking "+b.code+" cancelled");break;
    case "restore":
      if(b.hours.some(function(h){var o=bookingAt(b.date,b.court,h);return (o&&o!==b)||blockAt(b.date,b.court,h)})){toast("Can't restore: that slot is taken now");return}
      b.status="confirmed";break;
    case "unblock":var ids=a.getAttribute("data-ids").split(",");state.blocks=state.blocks.filter(function(x){return ids.indexOf(x.id)<0});toast("Block removed");break;
    default:return;
  }
  if(b)sf.flash=b.id;
  save();renderStaff();
});
document.getElementById("v-staff").addEventListener("change",function(e){if(e.target.id==="s-date"&&e.target.value){sf.date=e.target.value;renderStaff()}});

// ---------- reset ----------
var resetArmed=false,resetBtn=document.getElementById("resetBtn");
resetBtn.addEventListener("click",function(){
  if(!resetArmed){resetArmed=true;resetBtn.textContent="Tap again to reset";setTimeout(function(){resetArmed=false;resetBtn.textContent="Reset demo data"},3000);return}
  resetArmed=false;resetBtn.textContent="Reset demo data";state=null;state=seed();save();
  avDay=null;bk={date:null,court:null,hours:[],step:"pick",hint:"",last:null,form:null};mb={code:"",phone:"",found:null,err:"",confirmCancel:false};sf.date=null;sf.cancelAsk=null;
  route();toast("Demo data reset");
});

var RENDER={"home":renderHome,"book":renderBook,"my-booking":renderMy,"info":renderInfo,"staff":renderStaff};
route();
})();
